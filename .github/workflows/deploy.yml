name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  id-token: write

jobs:
  deploy-staging:
    if: >-
      vars.CD_ENABLED == 'true' &&
      (github.event_name == 'push' || inputs.environment == 'staging')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      DEPLOY_ENVIRONMENT: staging
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      APP_ORIGIN: ${{ vars.APP_ORIGIN }}
      PUBLIC_WEB_ORIGIN: ${{ vars.PUBLIC_WEB_ORIGIN || 'https://reunion.scicu-alumni.com' }}
      RELEASE_ID: ${{ github.sha }}
      VITE_CF_TURNSTILE_SITE_KEY: ${{ vars.VITE_CF_TURNSTILE_SITE_KEY }}
      VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
      VITE_LIFF_ID: ${{ vars.VITE_LIFF_ID }}
      SMTP_HOST: ${{ vars.SMTP_HOST }}
      SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
      SMTP_SECURE: ${{ vars.SMTP_SECURE || 'false' }}
      SMTP_FROM: ${{ vars.SMTP_FROM }}
      LOGIN_CLIENT_ID: ${{ vars.LOGIN_CLIENT_ID }}
      LINE_LOGIN_ENABLED: ${{ vars.LINE_LOGIN_ENABLED || 'false' }}
      LINE_LOGIN_CHANNEL_ID: ${{ vars.LINE_LOGIN_CHANNEL_ID }}
      SQL_DATABASE: ${{ vars.SQL_DATABASE }}
      SQL_USER: ${{ vars.SQL_USER }}
      SQL_MIGRATION_USER: ${{ vars.SQL_MIGRATION_USER }}
      SQL_SSL_SERVERNAME: ${{ vars.SQL_SSL_SERVERNAME }}
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            hosting/plesk-gateway/package-lock.json

      - name: Authenticate to Google Cloud with OIDC
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Test, build, deploy, smoke test, and promote
        run: ./scripts/release.sh deploy staging

  deploy-production:
    if: >-
      vars.CD_ENABLED == 'true' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.environment == 'production' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      DEPLOY_ENVIRONMENT: production
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      APP_ORIGIN: ${{ vars.APP_ORIGIN }}
      PUBLIC_WEB_ORIGIN: ${{ vars.PUBLIC_WEB_ORIGIN || 'https://reunion.scicu-alumni.com' }}
      RELEASE_ID: ${{ github.sha }}
      CONFIRM_PRODUCTION_DEPLOY: production
      VITE_CF_TURNSTILE_SITE_KEY: ${{ vars.VITE_CF_TURNSTILE_SITE_KEY }}
      VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
      VITE_LIFF_ID: ${{ vars.VITE_LIFF_ID }}
      SMTP_HOST: ${{ vars.SMTP_HOST }}
      SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
      SMTP_SECURE: ${{ vars.SMTP_SECURE || 'false' }}
      SMTP_FROM: ${{ vars.SMTP_FROM }}
      LOGIN_CLIENT_ID: ${{ vars.LOGIN_CLIENT_ID }}
      LINE_LOGIN_ENABLED: ${{ vars.LINE_LOGIN_ENABLED || 'false' }}
      LINE_LOGIN_CHANNEL_ID: ${{ vars.LINE_LOGIN_CHANNEL_ID }}
      SQL_DATABASE: ${{ vars.SQL_DATABASE }}
      SQL_USER: ${{ vars.SQL_USER }}
      SQL_MIGRATION_USER: ${{ vars.SQL_MIGRATION_USER }}
      SQL_SSL_SERVERNAME: ${{ vars.SQL_SSL_SERVERNAME }}
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            hosting/plesk-gateway/package-lock.json

      - name: Authenticate to Google Cloud with OIDC
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Test, build, migrate, deploy, smoke test, and promote
        run: ./scripts/release.sh deploy production
