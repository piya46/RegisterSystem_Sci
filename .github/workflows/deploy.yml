name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  id-token: write

jobs:
  deploy-staging:
    if: >-
      vars.CD_ENABLED == 'true' &&
      (github.event_name == 'push' || inputs.environment == 'staging')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      DEPLOY_ENVIRONMENT: staging
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      APP_ORIGIN: ${{ vars.APP_ORIGIN }}
      PUBLIC_WEB_ORIGIN: ${{ vars.PUBLIC_WEB_ORIGIN || 'https://reunion.scicu-alumni.com' }}
      RELEASE_ID: ${{ github.sha }}
      VITE_CF_TURNSTILE_SITE_KEY: ${{ vars.VITE_CF_TURNSTILE_SITE_KEY }}
      VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
      VITE_LIFF_ID: ${{ vars.VITE_LIFF_ID }}
      SMTP_HOST: ${{ vars.SMTP_HOST }}
      SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
      SMTP_SECURE: ${{ vars.SMTP_SECURE || 'false' }}
      SMTP_FROM: ${{ vars.SMTP_FROM }}
      LOGIN_CLIENT_ID: ${{ vars.LOGIN_CLIENT_ID }}
      LEGACY_EVENT_MIGRATION_WRITE: ${{ vars.LEGACY_EVENT_MIGRATION_WRITE || 'false' }}
      LINE_LOGIN_ENABLED: ${{ vars.LINE_LOGIN_ENABLED || 'false' }}
      LINE_LOGIN_CHANNEL_ID: ${{ vars.LINE_LOGIN_CHANNEL_ID }}
      SQL_DATABASE: ${{ vars.SQL_DATABASE }}
      SQL_USER: ${{ vars.SQL_USER }}
      SQL_MIGRATION_USER: ${{ vars.SQL_MIGRATION_USER }}
      SQL_ENABLED: ${{ vars.SQL_ENABLED || 'false' }}
      VERIFY_SQL_TRANSPORT: ${{ vars.VERIFY_SQL_TRANSPORT || 'false' }}
      SQL_PROVIDER: plesk
      SQL_HOST: 203.170.190.137
      SQL_EXPECTED_HOST: 203.170.190.137
      SQL_PORT: "3306"
      SQL_SSL_MODE: verify_identity
      SQL_SSL_CA_SECRET_NAME: SQL_SSL_CA
      SQL_SSL_SERVERNAME: ${{ vars.SQL_SSL_SERVERNAME }}
      SQL_SSL_IP_SAN_CONFIRMED: ${{ vars.SQL_SSL_IP_SAN_CONFIRMED || 'false' }}
      SQL_STATIC_EGRESS_ENABLED: ${{ vars.SQL_STATIC_EGRESS_ENABLED || 'false' }}
      SQL_NETWORK_ALLOWLIST_CONFIRMED: ${{ vars.SQL_NETWORK_ALLOWLIST_CONFIRMED || 'false' }}
      SQL_AT_REST_ENCRYPTION_CONFIRMED: ${{ vars.SQL_AT_REST_ENCRYPTION_CONFIRMED || 'false' }}
      SQL_BACKUP_ENCRYPTION_CONFIRMED: ${{ vars.SQL_BACKUP_ENCRYPTION_CONFIRMED || 'false' }}
      SQL_PRIMARY_STORE: "false"
      SQL_MIRROR_ENABLED: ${{ vars.SQL_MIRROR_ENABLED || 'false' }}
      SQL_MIRROR_REQUIRE_PROTECTED_VALUES: "true"
      SQL_OUTBOX_ENABLED: ${{ vars.SQL_OUTBOX_ENABLED || 'false' }}
      SQL_OUTBOX_STRICT: ${{ vars.SQL_OUTBOX_STRICT || 'false' }}
      RUN_SQL_MIGRATIONS: ${{ vars.RUN_SQL_MIGRATIONS || 'false' }}
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            hosting/plesk-gateway/package-lock.json

      - name: Authenticate to Google Cloud with OIDC
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Test, build, deploy, smoke test, and promote
        run: ./scripts/release.sh deploy staging

  deploy-production:
    if: >-
      vars.CD_ENABLED == 'true' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.environment == 'production' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      DEPLOY_ENVIRONMENT: production
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      APP_ORIGIN: ${{ vars.APP_ORIGIN }}
      PUBLIC_WEB_ORIGIN: ${{ vars.PUBLIC_WEB_ORIGIN || 'https://reunion.scicu-alumni.com' }}
      RELEASE_ID: ${{ github.sha }}
      CONFIRM_PRODUCTION_DEPLOY: production
      VITE_CF_TURNSTILE_SITE_KEY: ${{ vars.VITE_CF_TURNSTILE_SITE_KEY }}
      VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
      VITE_LIFF_ID: ${{ vars.VITE_LIFF_ID }}
      SMTP_HOST: ${{ vars.SMTP_HOST }}
      SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
      SMTP_SECURE: ${{ vars.SMTP_SECURE || 'false' }}
      SMTP_FROM: ${{ vars.SMTP_FROM }}
      LOGIN_CLIENT_ID: ${{ vars.LOGIN_CLIENT_ID }}
      LEGACY_EVENT_MIGRATION_WRITE: ${{ vars.LEGACY_EVENT_MIGRATION_WRITE || 'false' }}
      LINE_LOGIN_ENABLED: ${{ vars.LINE_LOGIN_ENABLED || 'false' }}
      LINE_LOGIN_CHANNEL_ID: ${{ vars.LINE_LOGIN_CHANNEL_ID }}
      SQL_DATABASE: ${{ vars.SQL_DATABASE }}
      SQL_USER: ${{ vars.SQL_USER }}
      SQL_MIGRATION_USER: ${{ vars.SQL_MIGRATION_USER }}
      SQL_ENABLED: ${{ vars.SQL_ENABLED || 'false' }}
      VERIFY_SQL_TRANSPORT: ${{ vars.VERIFY_SQL_TRANSPORT || 'false' }}
      SQL_PROVIDER: plesk
      SQL_HOST: 203.170.190.137
      SQL_EXPECTED_HOST: 203.170.190.137
      SQL_PORT: "3306"
      SQL_SSL_MODE: verify_identity
      SQL_SSL_CA_SECRET_NAME: SQL_SSL_CA
      SQL_SSL_SERVERNAME: ${{ vars.SQL_SSL_SERVERNAME }}
      SQL_SSL_IP_SAN_CONFIRMED: ${{ vars.SQL_SSL_IP_SAN_CONFIRMED || 'false' }}
      SQL_STATIC_EGRESS_ENABLED: ${{ vars.SQL_STATIC_EGRESS_ENABLED || 'false' }}
      SQL_NETWORK_ALLOWLIST_CONFIRMED: ${{ vars.SQL_NETWORK_ALLOWLIST_CONFIRMED || 'false' }}
      SQL_AT_REST_ENCRYPTION_CONFIRMED: ${{ vars.SQL_AT_REST_ENCRYPTION_CONFIRMED || 'false' }}
      SQL_BACKUP_ENCRYPTION_CONFIRMED: ${{ vars.SQL_BACKUP_ENCRYPTION_CONFIRMED || 'false' }}
      SQL_PRIMARY_STORE: "false"
      SQL_MIRROR_ENABLED: ${{ vars.SQL_MIRROR_ENABLED || 'false' }}
      SQL_MIRROR_REQUIRE_PROTECTED_VALUES: "true"
      SQL_OUTBOX_ENABLED: ${{ vars.SQL_OUTBOX_ENABLED || 'false' }}
      SQL_OUTBOX_STRICT: ${{ vars.SQL_OUTBOX_STRICT || 'false' }}
      RUN_SQL_MIGRATIONS: ${{ vars.RUN_SQL_MIGRATIONS || 'false' }}
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            hosting/plesk-gateway/package-lock.json

      - name: Authenticate to Google Cloud with OIDC
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Test, build, migrate, deploy, smoke test, and promote
        run: ./scripts/release.sh deploy production
